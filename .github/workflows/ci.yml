name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check generated asset links
        run: test -s dist/.well-known/assetlinks.json && cat dist/.well-known/assetlinks.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  android:
    name: TWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Check twa-manifest.json matches app.config.json
        run: node scripts/sync-twa-manifest.mjs --check
      # Unsigned build: proves the project compiles. Nothing is signed or uploaded.
      - run: ./gradlew --no-daemon assembleDebug
